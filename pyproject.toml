[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "vectorized-db"
version = "0.1.0"
dependencies = [
  "fastapi>=0.162.0",
  "uvicorn>=0.54.0",
  "python-multipart>=0.0.32",
]
requires-python = ">=3.10"

[project.scripts]
vectordb-ui = "vectorized_db.main:start_server"

[tool.setuptools]
packages = ["vectorized_db"]
include-package-data = true

[tool.setuptools.package-data]
vectorized_db = ["static/*", "sample_docs/*", "stopwords.txt"]