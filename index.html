<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>VectorizedDB</title>
</head>
<body>
  <div>Backend status: <span id="server-status">Checking...</span></div>
  <hr>

  <div>
    <h3>Master vocabulary</h3>
    <p id="vocab-container">Loading container...</p>
  </div>

  <hr>

  <div>
    <h3>Document vectors</h3>
    <ul id="vector-container"></ul>
  </div>

  <hr>

  <div>
    <h3>Search documents</h3>
    <input id="search-box" type="text" placeholder="Type words to search...">
    <button onclick="performSearch()" id="search-button">Search</button>
    <ul id="search-results"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
