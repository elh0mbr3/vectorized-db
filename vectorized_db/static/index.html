<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>VectorizedDB</title>
</head>
<body>
  <img src="Vectorized-DB.png" class="logo">

  <div>Backend status: <span id="server-status" style="font-weight: bold;">Checking...</span></div>

  <div>
    <h3>Master vocabulary:</h3>
    <p id="vocab-container" class="results-output">Loading container...</p>
  </div>

  <div>
    <h3>Document vectors:</h3>
    <ul id="vector-container" class="results-output"></ul>
  </div>

  <div>
    <h3>Search documents</h3>
    <div class="form-group">
      <input id="search-box" type="text" placeholder="Type words to search...">
      <button onclick="performSearch()" id="search-button">Search</button>
    </div>
    <ul id="search-results"></ul>
  </div>

  <div class="upload-section">
    <h3>Upload new document</h3>
    <div class="form-group">
      <input type="file" id="docUpload" accept=".txt"><br><br>
      <button onclick="uploadDocument()">Upload Document</button>
    </div>
    <p id="upload-status"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
